<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudioSocial</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StudioSocial">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">

<style>
:root{color-scheme:light;--bg:#fff;--hero:#fff;--card:#fff;--ink:#2d2210;--mute:#86714f;--line:#fdeccb;--me:#f47c16;--you:#ffd23f;--soft:#fff6e3;--on:#2a1600;--me-t:#b34700;--on-you:#3a2a00;--me2:#ffb347;--glow:244,124,22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Pink: sign-in, sign-up and the studio picker. Studio themes (CorePower is the default tokens above), switched by the studio menu */
:root[data-studio="pink"]{--bg:#fff5f9;--hero:#ffe3ee;--me:#d9457e;--me2:#f4789f;--me-t:#c2306a;--you:#fbb8cd;--soft:#fff0f5;--line:#fbdce8;--ink:#3a1f2b;--mute:#8a5b6d;--on:#fff;--on-you:#5a1030;--glow:217,69,126}
.tabs[hidden]{display:none}
.auth{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px 18px 14px;box-shadow:0 10px 30px rgba(var(--glow),.12)}
.auth h2{margin-top:4px}.hero{text-align:center;margin:8px 0 18px}.hero svg{width:84px;height:84px;display:block;margin:0 auto 6px}
.studio{display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;background:var(--card)}
.studio.on{border-color:var(--me);background:var(--soft)}.studio input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--me)}
.code{letter-spacing:.4em;text-align:center;font-size:22px;font-weight:700}
.ok{color:#2a8a4a;font-weight:700}.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--me-t)}
.locrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);padding:12px;border-radius:12px;font:inherit;text-align:left;cursor:pointer}.locrow.on{background:var(--soft);font-weight:700}.locrow:focus-visible{outline:3px solid var(--you);outline-offset:2px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
:root[data-studio="solid"]{--me:#2f55d4;--me2:#6f8cf0;--me-t:#2a49bd;--you:#111111;--on:#fff;--on-you:#fff;--soft:#eef2ff;--line:#e2e7f7;--ink:#0b0b0f;--mute:#5a6275;--glow:47,85,212}
:root[data-studio="barre"]{--me:#e02020;--me2:#ff6b6b;--me-t:#c81818;--you:#ffb3b3;--on:#fff;--on-you:#5a1010;--soft:#fff0f0;--line:#fde0e0;--ink:#2a1214;--mute:#8a5f62;--glow:224,32,32}
@media not all{:root:not([data-theme="light"]){--bg:#13111f;--card:#1e1b30;--ink:#f1effa;--mute:#a09bbd;--line:#2f2b47;--me:#8d78ff;--you:#2fd8b4;--soft:#2a2547;--hero:#1d1836;--on:#0f0c1c}}
:root[data-theme="dark"]{--bg:#13111f;--card:#1e1b30;--ink:#f1effa;--mute:#a09bbd;--line:#2f2b47;--me:#8d78ff;--you:#2fd8b4;--soft:#2a2547;--hero:#1d1836;--on:#0f0c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--hero) 0,var(--bg) 300px) no-repeat var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top{position:relative}
.mark{width:52px;height:34px;position:relative;flex:none;display:block;border:0;background:none;padding:0;cursor:pointer}
.mark svg.ring{position:absolute;left:0;top:0;width:34px;height:34px;display:block}.ring .a{fill:var(--me2)}.ring .b{fill:var(--you)}.ring .c{fill:var(--me)}
.mark.single{cursor:default}.mark.single .chev{display:none}
.mark .chev{position:absolute;left:36px;top:9px;width:16px;height:16px;overflow:visible;fill:none;stroke:var(--mute);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.mark[aria-expanded="true"] .chev{transform:rotate(180deg)}
.menu{position:absolute;left:0;top:calc(100% + 4px);z-index:20;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 12px 32px rgba(60,45,140,.16)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);padding:12px;border-radius:12px;font:inherit;text-align:left;cursor:pointer}
.menu button.on{background:var(--soft);font-weight:700}
.menu button svg{width:16px;height:16px;margin-left:auto;fill:none;stroke:var(--me-t);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu small{display:block;padding:6px 12px 4px;font-size:12px;color:var(--mute)}
h1{font-size:26px;margin:0;letter-spacing:-.3px}
h2{font-size:18px;margin:20px 0 8px;letter-spacing:-.2px}
p{margin:4px 0}.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 6px 22px rgba(var(--glow),.07)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.av{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.avs{display:flex}.avs .av{width:26px;height:26px;font-size:12px;margin-left:-6px;border:2px solid var(--card)}.avs .av:first-child{margin-left:0}
.cls b{display:block}.cls{border-left:6px solid var(--you)}.days{display:flex;gap:8px;margin:6px 0 12px}.day{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:8px 0;font:inherit;cursor:pointer}.day span{display:block;font-size:12px;color:var(--mute)}.day b{font-size:18px}.day.on{background:var(--me);color:var(--on);border-color:var(--me-t)}.day.on span{color:var(--on)}.day:focus-visible{outline:3px solid var(--you);outline-offset:2px}.slot{display:flex;gap:10px}.slot .tm{width:56px;flex:none;font-size:13px;color:var(--mute);padding-top:18px}.slot .card{flex:1;min-width:0}.pill{background:var(--soft);color:var(--me-t);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.btn{border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:600;background:linear-gradient(135deg,var(--me),var(--me2));color:var(--on);cursor:pointer;box-shadow:0 6px 14px rgba(var(--glow),.2)}
.btn.alt{background:var(--soft);color:var(--ink);box-shadow:none}.btn:disabled{opacity:.6;cursor:default}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,.tabs button:focus-visible{outline:3px solid var(--you);outline-offset:2px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;color:var(--ink);padding:7px 4px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--me);color:var(--on);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--you);color:var(--on-you);border-color:var(--you);font-weight:600}.chip:disabled{opacity:.5;cursor:default}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.sw{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:var(--line);cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--me)}.sw.on::after{transform:translateX(20px)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{display:flex;width:100%;max-width:480px;padding:6px 8px;gap:4px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:10px 4px 12px;font:inherit;font-size:12px;cursor:pointer}
.tabs button span{display:block;height:24px;margin-bottom:2px}.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.tabs button.on{color:var(--me-t);font-weight:700;background:var(--soft);border-radius:16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
.link{background:none;border:0;color:var(--me-t);font:inherit;font-size:14px;cursor:pointer;padding:4px 0}
input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin:6px 0;background:#fff;color:var(--ink)}
input[type=file]{border:0;padding:8px 0}label{font-size:14px;color:var(--mute);display:block}.err{color:#c0392b;font-size:14px}
input:focus-visible,textarea:focus-visible,.link:focus-visible{outline:3px solid var(--you);outline-offset:2px}
.banner{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><button class="mark" id="mark" type="button" onclick="toggleMenu(event)" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="Switch studio"><span id="ringslot"></span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6"/></svg></button><div class="menu" id="menu" role="menu" hidden></div><h1>StudioSocial</h1><span class="mute" id="studio-label">CorePower · Chicago</span></div>
  <p class="mute" id="hint" style="margin:-6px 0 10px" hidden>Tap the logo to choose a studio.</p>
  <main id="app"></main>
</div>
<nav class="tabs" id="nav" aria-label="Main" hidden><div id="tabs"></div></nav>
<div id="toast" role="status"></div>
<script>
const D=["Mon","Tue","Wed","Thu","Fri"],T=["6:00 AM","12:00 PM","6:00 PM"];
const STUDIOS={
 "CorePower":{n:["Yoga Sculpt","CorePower StrengthX","CorePower1","CorePower 2"],z:["Lakeview","Lincoln Park","Old Town"]},
 "Solid Core":{n:["Signature50","Foundation50","Advanced50"],z:["River North","Wicker Park","West Loop"]},
 "Pure Barre":{n:["Pure Barre Classic","Pure Barre Define","Pure Barre Align","Pure Barre Empower"],z:["Old Town","Lincoln Park","Hyde Park"]}
};
const SN=Object.keys(STUDIOS);
let C=[],byId={};
function build(){const st=STUDIOS[S.studio],N=st.n,Z=st.z;C=[];D.forEach((d,i)=>T.forEach((t,j)=>C.push({id:i+"-"+j,d:d,t:t,n:(i===1&&j===1)?N[0]:N[(i+j)%N.length],l:Z[(i*2+j)%3],s:(i*5+j*7)%9+2})));byId=Object.fromEntries(C.map(c=>[c.id,c]))}
const k=id=>{const p=id.split("-");return p[0]*3+ +p[1]};
const ord=(a,b)=>k(a)-k(b);
const F=[
 {id:"maya",n:"Jillian",c:"#e8567a",bs:{"CorePower":["0-2","1-0","3-1"],"Solid Core":["0-1","2-2","3-0"],"Pure Barre":["1-2","2-0","4-1"]},their:"full",mine:"full"},
 {id:"jordan",n:"Jackie",c:"#2b8fd9",bs:{"CorePower":["1-2","2-1","4-0"],"Solid Core":["1-1","3-2","4-2"],"Pure Barre":["0-0","3-2","4-0"]},their:"busy",mine:"busy"},
 {id:"priya",n:"Laura",c:"#d98a1f",bs:{"CorePower":["0-0","2-0","4-2"],"Solid Core":["0-2","2-1","4-0"],"Pure Barre":["0-1","1-1","3-0"]},their:"full",mine:"hidden"},
 {id:"sam",n:"Alyssa",c:"#7a5ac8",bs:{"CorePower":["1-1","3-2"],"Solid Core":["2-0","4-1"],"Pure Barre":["1-0","3-2"]},their:"hidden",mine:"busy"}
];
const L={full:"Full schedule",busy:"Busy only",hidden:"Hidden"};
const S={locSel:null,locOpen:false,stage:"signin",my:new Set(),linked:new Set(),codeFor:null,codeMsg:"",loc:null,locMsg:"",fromMe:false,editing:false,studio:"CorePower",tab:"home",day:"Tue",me:new Set(["0-2","1-1","2-0","3-2"]),priv:new Set(),hideAll:false,sel:new Set(),inv:new Set(),open:null,reqs:["kaira","naomi"],extra:[],man:{},imp:{text:"",rows:null,checks:[],errors:[],msg:"",note:null}};
const REQS={
 kaira:{n:"Kaira",c:"#4a9d6b",bs:{"CorePower":["1-1","3-2"],"Solid Core":["1-2","4-1"],"Pure Barre":["0-2","2-1"]}},
 naomi:{n:"Naomi",c:"#2a9d8f",bs:{"CorePower":["0-1","2-2"],"Solid Core":["0-0","3-1"],"Pure Barre":["1-1","4-2"]}}
};
const ST={"Solid Core":{me:new Set(["0-0","2-1","3-2"]),priv:new Set(),extra:[]},"Pure Barre":{me:new Set(["1-0","3-1"]),priv:new Set(),extra:[]}};
function useStudio(){F.forEach(f=>{f.b=f.bs[S.studio]})}
function setStudio(name){
  ST[S.studio]={me:S.me,priv:S.priv,extra:S.extra};
  S.studio=name;
  const s=ST[S.studio];S.me=s.me;S.priv=s.priv;S.extra=s.extra;
  S.man={};S.imp={text:"",rows:null,checks:[],errors:[],msg:"",note:null};S.open=null;S.sel=new Set();S.locSel=null;S.locOpen=false;
  build();useStudio();
}
function menuOpen(o){document.getElementById("menu").hidden=!o;document.getElementById("mark").setAttribute("aria-expanded",String(o));if(o)document.getElementById("hint").hidden=true}
function toggleMenu(e){e.stopPropagation();if(S.stage!=="app"||S.my.size<2)return;menuOpen(document.getElementById("menu").hidden)}
function pickStudio(name){menuOpen(false);if(name===S.studio)return;setStudio(name);toast("Switched to "+S.studio);R();document.getElementById("mark").focus()}
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))menuOpen(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("menu").hidden){menuOpen(false);document.getElementById("mark").focus()}});
const av=f=>`<span class="av" style="background:${f.c}">${f.n[0]}</span>`;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200)}
function go(t){S.tab=t;R()}
function sched(f){
  if(f.their==="hidden")return `<p class="mute">${f.n} has hidden their schedule from you.</p>`;
  return f.b.slice().sort(ord).map(id=>{const c=byId[id];return `<div class="line"><span>${c.d} ${c.t}</span><span>${f.their==="full"?c.n:"Busy"}</span></div>`}).join("");
}
function home(){
  const di=D.indexOf(S.day);
  let h=S.hideAll?`<div class="banner">Your schedule is hidden from everyone right now.</div>`:"";
  h+=`<div class="days" role="tablist" aria-label="Day">`+D.map((d,i)=>`<button class="day ${S.day===d?"on":""}" role="tab" aria-selected="${S.day===d}" onclick="S.day='${d}';R()"><span>${d}</span><b>${2+i}</b></button>`).join("")+`</div>`;
  const nr=nearest();if(!S.linked.has(S.studio))h+=`<div class="banner">Link your ${S.studio} membership to confirm it’s you. <button class="link" onclick="linkFromMe()">Link now</button></div>`;if(nr){h+=`<div class="row" style="gap:4px"><p class="mute">Nearest to you: <b>${nr.z}</b> · ${fmtMi(nr.d)}</p><button class="link" style="padding:4px 8px" aria-label="Other close locations" aria-expanded="${S.locOpen}" aria-controls="loclist" onclick="S.locOpen=!S.locOpen;R()"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;transform:rotate(${S.locOpen?180:0}deg)"><path d="M3.5 6 8 10.5 12.5 6"/></svg></button></div>`;if(S.locOpen)h+=`<div class="card" id="loclist" style="padding:6px"><div class="menu-list">`+[{z:null}].concat(ranked()).map(r=>`<button class="locrow ${S.locSel===r.z?"on":""}" onclick="pickLoc(${r.z?"'"+r.z+"'":"null"})"><span class="grow">${r.z||"All locations"}</span><span class="mute">${r.z?fmtMi(r.d):""}</span>${S.locSel===r.z?`<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" style="fill:none;stroke:var(--me-t);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M3 8.5 6.5 12 13 4.5"/></svg>`:""}</button>`).join("")+`</div></div>`;if(S.locSel)h+=`<p class="mute">Showing classes at ${S.locSel} only.</p>`}h+=`<p class="mute">November ${2+di}. Friends who share their schedule show up on each class.</p>`;
  let shown=0;
  h+=T.map((t,j)=>{
    const id=di+"-"+j,c=byId[id],booked=S.me.has(id);
    if(S.locSel&&c.l!==S.locSel)return "";shown++;
    const pals=F.filter(f=>f.their==="full"&&f.b.includes(id)),busy=F.filter(f=>f.their==="busy"&&f.b.includes(id));
    const spots=c.s-(booked?1:0);
    let who="";
    if(pals.length)who=`<div class="row" style="margin-top:10px"><div class="avs">${pals.map(av).join("")}</div><span class="mute">${pals.map(f=>f.n).join(" & ")} ${pals.length>1?"are":"is"} going</span></div>`;
    if(busy.length)who+=`<p class="mute" style="margin-top:6px">${busy.map(f=>f.n).join(" & ")} ${busy.length>1?"are":"is"} booked at this time</p>`;
    const btn=booked?`<button class="btn alt" onclick="cancel('${id}')">Cancel</button>`:`<button class="btn" onclick="book('${id}')">${pals.length?"Book with "+pals[0].n+(pals.length>1?" +"+(pals.length-1):""):"Book"}</button>`;
    return `<div class="slot"><div class="tm">${t}</div><div class="card cls"><div class="row"><div class="grow"><b>${c.n}</b><span class="mute">${c.l} · ${spots} spots left</span></div>${nr&&nr.z===c.l?`<span class="pill">Nearest</span>`:""}</div>${who}<div class="row" style="margin-top:12px;justify-content:space-between"><span class="mute">${booked?(S.priv.has(id)?"Booked · private":"Booked"):""}</span>${btn}</div></div></div>`;
  }).join("");
  if(S.locSel&&!shown)h+=`<div class="card mute">No classes at ${S.locSel} on this day.</div>`;
  return h;
}
function book(id){const c=byId[id];S.me.add(id);toast("Booked "+c.n+", "+c.d+" "+c.t);R()}
function cancel(id){const c=byId[id];S.me.delete(id);S.priv.delete(id);toast("Cancelled "+c.n+", "+c.d+" "+c.t);R()}
function friends(){
  let h="";
  h+=S.reqs.map(id=>{const r=REQS[id];return `<div class="card"><div class="row"><span class="av" style="background:${r.c}">${r.n[0]}</span><div class="grow"><b>${r.n} wants to connect</b><p class="mute">Member at your studio</p></div></div><p class="mute" style="margin:8px 0">Accepting shares nothing until you choose.</p><div class="row"><button class="btn" onclick="reply('${id}',1)">Accept</button><button class="btn alt" onclick="reply('${id}',0)">Decline</button></div></div>`}).join("");
  h+=`<h2>Friends</h2>`;
  h+=F.map(f=>`<div class="card"><button class="row" style="all:unset;display:flex;gap:10px;align-items:center;width:100%;cursor:pointer" onclick="S.open=S.open==='${f.id}'?null:'${f.id}';R()" aria-expanded="${S.open===f.id}">${av(f)}<span class="grow"><b>${f.n}</b><br><span class="mute">Shares: ${L[f.their]}</span></span><span class="mute">${S.open===f.id?"Hide":"View"}</span></button>${S.open===f.id?`<div style="margin-top:8px">${sched(f)}</div>`:""}</div>`).join("");
  return h;
}
function find(){
  let h=`<h2>Find a time</h2><p class="mute">Pick friends and see classes where everyone is free.</p><div class="chips" style="margin:12px 0">`;
  h+=F.map(f=>f.their==="hidden"?`<button class="chip" disabled>${f.n} (hidden)</button>`:`<button class="chip ${S.sel.has(f.id)?"on":""}" onclick="pick('${f.id}')">${f.n}</button>`).join("")+`</div>`;
  if(!S.sel.size)return h+`<div class="card mute">Choose at least one friend to see matching classes.</div>`;
  const fs=F.filter(f=>S.sel.has(f.id)),names=fs.map(f=>f.n).join(" & ");
  const res=C.filter(c=>!S.me.has(c.id)&&fs.every(f=>!f.b.includes(c.id)));
  h+=`<p class="mute">${res.length} classes work for you and ${names}.</p>`;

    let body=ok?`<span class="ok">Linked ✓</span>`:open?`<p class="mute" style="margin:8px 0 0">${n} sent a 6-digit code. It works for 10 minutes.</p><input class="code" id="code-in" inputmode="numeric" maxlength="6" placeholder="······" aria-label="${n} confirmation code" autocomplete="one-time-code"><p class="mute">Demo: the code is 123456.</p>${S.codeMsg?`<p class="err" role="alert">${esc(S.codeMsg)}</p>`:""}<div class="row"><button class="btn" onclick="checkCode('${n}')">Verify code</button><button class="link" onclick="sendCode('${n}')">Send again</button></div>`:`<button class="btn" onclick="sendCode('${n}')">Send confirmation code</button>`;
    return `<div class="card"><div class="row"><span class="dot" style="background:${DOTS[n]}"></span><b class="grow">${n}</b>${ok?"":`<span class="tag">Not linked</span>`}</div><div style="margin-top:8px">${body}</div></div>`}).join("");
  h+=`<div class="card"><b>Find studios near you</b><p class="mute" style="margin:4px 0 8px">Share your location to see your nearest studio first. We use it on your phone to sort locations and never share it with friends.</p>`;
  if(S.loc)h+=`<p class="ok">Location on${S.loc.demo?" (demo: Lincoln Park)":""} ✓</p><button class="link" onclick="clearLoc()">Turn off</button>`;
  else h+=`<div class="row"><button class="btn alt" onclick="shareLoc()">Use my location</button><button class="link" onclick="demoLoc()">Try a demo spot</button></div>`+(S.locMsg?`<p class="mute" role="status" style="margin-top:6px">${esc(S.locMsg)}</p>`:"");
  h+=`</div><button class="btn" style="width:100%" onclick="finishLink()">${S.linked.size?"Continue":"Skip for now"}</button></div>`;
  return h;
}
function finishLink(){S.stage="app";S.tab=S.fromMe?"me":"home";S.fromMe=false;toast(S.linked.size?"You’re all set":"You can link a membership later in Me");R();window.scrollTo(0,0)}
function linkFromMe(){S.fromMe=true;S.stage="link";S.codeFor=null;S.codeMsg="";R();window.scrollTo(0,0)}
function editStudios(){S.pend=new Set(S.my);S.editing=true;S.stage="pick";R()}
function signOut(){S.stage="signin";S.my=new Set();S.pend=new Set();S.linked=new Set();S.loc=null;S.locMsg="";S.codeFor=null;S.tab="home";R();window.scrollTo(0,0)}
function R(){
  document.getElementById("ringslot").innerHTML=ring();
  if(S.stage!=="app"){
    document.documentElement.dataset.studio="pink";
    document.getElementById("nav").hidden=true;menuOpen(false);
    document.getElementById("hint").hidden=true;
    document.getElementById("studio-label").textContent="";
    document.getElementById("mark").classList.add("single");
    document.getElementById("mark").setAttribute("aria-label","StudioSocial");
    document.getElementById("app").innerHTML=S.stage==="pick"?pickView():S.stage==="link"?linkView():authView(S.stage==="signup");
    return;
  }
  document.getElementById("nav").hidden=false;
  document.getElementById("mark").classList.toggle("single",S.my.size<2);
  document.documentElement.dataset.studio={"CorePower":"core","Solid Core":"solid","Pure Barre":"barre"}[S.studio];
  document.getElementById("studio-label").textContent=S.studio;if(!S.hintShown&&S.my.size>1){S.hintShown=true;document.getElementById("hint").hidden=false}
  document.getElementById("mark").setAttribute("aria-label",S.my.size>1?"Switch studio. Now showing "+S.studio:S.studio);
  document.getElementById("menu").innerHTML='<small>Studio</small>'+SN.filter(n=>S.my.has(n)).map(n=>`<button role="menuitemradio" aria-checked="${n===S.studio}" class="${n===S.studio?"on":""}" onclick="pickStudio(\'${n}\')"><span>${n}</span>${n===S.studio?'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5"/></svg>':""}</button>`).join("");
  document.getElementById("app").innerHTML={home:home,friends:friends,me:me,privacy:privacy}[S.tab]();
  document.getElementById("tabs").innerHTML=[["home",'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>',"Home"],["friends",'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>',"Friends"],["me",'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1-3.5 4-5 7-5s6 1.5 7 5"/></svg>',"Me"],["privacy",'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 5 6v5.5c0 4.2 3 7.2 7 9 4-1.8 7-4.8 7-9V6z"/></svg>',"Privacy"]].map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="go('${t[0]}')" ${S.tab===t[0]?'aria-current="page"':""}><span>${t[1]}</span>${t[2]}</button>`).join("");
}
function reply(id,ok){const r=REQS[id];S.reqs=S.reqs.filter(x=>x!==id);if(ok){F.push({id:id,n:r.n,c:r.c,bs:r.bs,b:[],their:"busy",mine:"hidden"});useStudio();toast(r.n+" added. They can’t see your schedule yet.")}else toast("Request declined");R()}
function pick(id){S.sel.has(id)?S.sel.delete(id):S.sel.add(id);R()}
function join(id){S.inv.add(id);const n=[...S.sel].map(x=>F.find(f=>f.id===x).n).join(" & ");toast("Invite sent to "+n);R()}
function setM(id,v){F.find(f=>f.id===id).mine=v;toast(F.find(f=>f.id===id).n+" now sees: "+L[v]);R()}
function priv(id){S.priv.has(id)?S.priv.delete(id):S.priv.add(id);R()}
build();useStudio();R();
</script>
</body>
</html>
